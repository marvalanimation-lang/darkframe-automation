
name: DARKFRAME Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Generate Stickman frames
        run: python src/main.py

      - name: Save output
        uses: actions/upload-artifact@v4
        with:
          name: darkframe-frames
          path: output/
          
